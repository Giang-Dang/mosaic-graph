# The composer's input: which subgraphs make up Mosaic's graph, where each one
# answers, and where to read its schema.
#
# Chapter 8 created this file with two entries and did not use it. Chapter 9
# read the errors it produces properly, chapter 10 put a router in front of the
# result, and chapter 12 took it from two subgraphs to six. That last change is
# the one that made the file worth reading on its own: this is now the only
# place in the repository where the whole graph is described, and the list below
# is the closest thing Mosaic has to an organisation chart.
#
# The schema files are what each service publishes through `_service { sdl }`,
# committed under schema/. The introspection form points the composer at a
# running service instead:
#
#   introspection:
#     url: http://localhost:5101/graphql
#
# Order is not significant to the composer and is significant to a reader, so
# these are listed in the order chapter 12 extracted them: the service that was
# already out, then the three that reference nobody, then the two that do.
# Chapter 13 added a seventh at the end, which is the only entry here that owns
# no domain: it exists to publish the two root fields that turn a global
# identifier back into the thing it names.

version: 1

subgraphs:
  - name: catalog
    routing_url: http://localhost:5101/graphql
    schema:
      file: ../schema/catalog.graphql

  - name: pricing
    routing_url: http://localhost:5102/graphql
    schema:
      file: ../schema/pricing.graphql

  - name: inventory
    routing_url: http://localhost:5103/graphql
    schema:
      file: ../schema/inventory.graphql

  - name: accounts
    routing_url: http://localhost:5104/graphql
    schema:
      file: ../schema/accounts.graphql

  - name: reviews
    routing_url: http://localhost:5105/graphql
    schema:
      file: ../schema/reviews.graphql
    # Chapter 14. The only subgraph in this file with a subscription block, and
    # the only one that needs one, because it is the only one with a
    # Subscription type. Everything here is a default made explicit except the
    # last line, which is a default overridden.
    #
    # Left to itself the router offers a subgraph both WebSocket subprotocols
    # and lets it pick. HotChocolate 16.6.0 picks the first one registered in
    # its own container rather than the first one offered, and that is the
    # Apollo subscriptions-transport-ws handler, whose subprotocol name is
    # confusingly `graphql-ws`. So the default arrangement quietly runs on a
    # protocol that has been deprecated since 2019. Naming it here is what makes
    # the handshake answer `graphql-transport-ws` instead.
    #
    # Note the spelling. wgc 0.129.7's own documentation writes this key as
    # `websocket_subprotocol`, matching every other key in this file; the code
    # reads `websocketSubprotocol`. The documented spelling composes without a
    # word and leaves the setting at auto.
    subscription:
      url: http://localhost:5105/graphql
      protocol: ws
      websocketSubprotocol: graphql-transport-ws

  - name: ordering
    routing_url: http://localhost:5106/graphql
    schema:
      file: ../schema/ordering.graphql

  - name: nodes
    routing_url: http://localhost:5107/graphql
    schema:
      file: ../schema/nodes.graphql

  # Chapter 14, and the strangest entry in this file: a subgraph with no
  # service behind it. schema/streams.graphql declares one subscription field
  # and one directive, and there is no project, no port and no process. The
  # router reads the directive, connects to NATS itself, and resolves the
  # payload out of the other seven by key.
  #
  # routing_url is required and is never called. It is pointed at a port
  # nothing listens on deliberately: a reader who suspects something is quietly
  # serving this can check.
  - name: streams
    routing_url: http://localhost:5108/graphql
    schema:
      file: ../schema/streams.graphql
