# This file is the spine. Later chapters attach subgraphs and a router to it,
# and every one of them shows up here as another service on the mosaic network.
# Chapter 4 attached the first of those: a database. Chapter 8 attached the
# second, and it is the one that changes what Mosaic is: the half of it that
# owns products now runs as mosaic-catalog, beside mosaic-api rather than
# inside it.

services:
  mosaic-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
    ports:
      # Published on the host so `dotnet run` and `docker compose up` reach the
      # same database with the same connection string. A deployed Mosaic would
      # not publish this port at all.
      - "5432:5432"
    volumes:
      # Mounted at /var/lib/postgresql, not at its /data subdirectory. The
      # official image changed this at 18: it now keeps the cluster in a
      # version-named directory underneath, so that pg_upgrade can see the old
      # and the new one without crossing a mount point. Mount the old path
      # against an 18 image and the container refuses to start, with a long and
      # unusually good explanation of why.
      - mosaic-db-data:/var/lib/postgresql
    healthcheck:
      # pg_isready answers as soon as the server accepts connections. The first
      # start of a fresh volume runs initdb and then restarts the server, so
      # without a health gate the API would connect during that window and die.
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - mosaic
    restart: unless-stopped

  mosaic-api:
    build:
      context: .
      dockerfile: src/Mosaic.Api/Dockerfile
    image: mosaic-api:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      # HotChocolate 16 serves introspection only in Development. The Postman
      # collection for this chapter reads the schema by introspecting it, so
      # the container has to run in Development for that to work.
      #
      # This is a development baseline, not a production posture. A deployed
      # Mosaic would set Production here and leave introspection closed, which
      # is the default precisely because an open schema is a map of your API
      # for anyone who asks.
      ASPNETCORE_ENVIRONMENT: Development

      # The one setting that differs between the two ways of running Mosaic.
      # appsettings.json says localhost, which is right for `dotnet run`;
      # inside the network the database answers to its service name.
      ConnectionStrings__Mosaic: "Host=mosaic-db;Port=5432;Database=mosaic;Username=mosaic;Password=mosaic"
    ports:
      # Host 5100 to container 8080, so http://localhost:5100/graphql is the
      # URL either way: `dotnet run` (which binds 5100 directly) or this file.
      - "5100:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # HotChocolate 16 builds the whole schema during startup, so a schema
      # error kills the container at boot instead of waiting for the first
      # query. Since chapter 4 the seeder runs there too. That work happens
      # before /health answers, and start_period covers it: failures inside the
      # window do not count against the container.
      start_period: 30s
    restart: unless-stopped

  mosaic-catalog:
    # Chapter 8's extraction. Deliberately the same shape as mosaic-api above,
    # down to the healthcheck: two services that start, answer and fail the
    # same way are two services one team can operate.
    build:
      context: .
      dockerfile: src/Mosaic.Catalog/Dockerfile
    image: mosaic-catalog:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      # Development for the same reason mosaic-api runs in it: HotChocolate 16
      # serves introspection in no other environment, and a subgraph nothing can
      # introspect is a subgraph no tool can be pointed at. A development
      # baseline, not a production posture.
      ASPNETCORE_ENVIRONMENT: Development

      # Catalog's own database, on the server the two services share. A
      # database of its own rather than another schema inside mosaic: after
      # this chapter the two services own their data separately, and a join
      # across that seam should not be one connection string away. The
      # credentials are still the shared development ones, which is a
      # convenience here and would be a finding anywhere else.
      #
      # Nothing in this file creates the database. EF Core's
      # EnsureCreatedAsync does, on Catalog's first start, which is why chapter
      # 8 added a service here and no storage.
      ConnectionStrings__Catalog: "Host=mosaic-db;Port=5432;Database=catalog;Username=mosaic;Password=mosaic"
    ports:
      # Host 5101 to container 8080, matching the launch profile and the
      # routing URL federation/mosaic.yaml gives this subgraph, so composing
      # against a running Catalog does not depend on how it was started.
      - "5101:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Schema build and seeding happen before /health answers here too, and
      # the seeder has more to do on a cold start than mosaic-api's: it creates
      # the database before it fills it.
      start_period: 30s
    restart: unless-stopped

  wire-router:
    # Chapter 7's sample: the Cosmo Router in front of the two subgraphs under
    # samples/federated-wire. It is behind a compose profile, so nothing that
    # starts Mosaic starts this, and it is not on the mosaic network because it
    # talks to two processes on the host rather than to anything in this file.
    #
    # Compose the execution config before bringing this up, or the bind mount
    # below creates a directory where the file should be:
    #
    #   npx wgc router compose -i samples/federated-wire/graph.yaml \
    #                          -o samples/federated-wire/supergraph.json
    profiles: ["wire"]
    image: ghcr.io/wundergraph/cosmo/router:0.337.1
    environment:
      # No GRAPH_API_TOKEN. The router wants one to fetch its schema from the
      # Cosmo registry; with a static execution config there is nothing to
      # fetch, and the documented cost of leaving it out is that the default
      # telemetry stack stays off.
      EXECUTION_CONFIG_FILE_PATH: "/etc/wire/supergraph.json"

      # Development mode does two things chapter 7 needs: readable log output,
      # and Advanced Request Tracing without an authentication check in front
      # of it. Query plans are part of that, so this is not optional here.
      DEV_MODE: "true"
      LISTEN_ADDR: "0.0.0.0:3002"
    volumes:
      - ./samples/federated-wire/supergraph.json:/etc/wire/supergraph.json:ro
    ports:
      - "3002:3002"
    extra_hosts:
      # The subgraphs run on the host under `dotnet run`, not in a container.
      - "host.docker.internal:host-gateway"

networks:
  mosaic:
    name: mosaic

volumes:
  mosaic-db-data:
    name: mosaic-db-data
