# This file is the spine. Later chapters attach subgraphs and a router to it,
# and every one of them shows up here as another service on the mosaic network.
# Chapter 4 attached the first of those: a database. Chapter 8 attached the
# second, and it is the one that changed what Mosaic is: the half of it that
# owns products moved out into mosaic-catalog, beside mosaic-api rather than
# inside it.
#
# Chapter 12 finished the job and mosaic-api is not in this file any more. The
# five domains it still ran are five services now, on 5102 to 5106, and every
# one of them is the same nine lines with a name and a port changed. That
# sameness is the point rather than an accident: the differences between these
# services are in their schemas, and a difference in how they start is a
# difference somebody has to remember at three in the morning.
#
# The database container did not change. Six services share one PostgreSQL
# server and none of them shares a database with another, which is a deployment
# convenience on one side of a line and the whole extraction on the other.

services:
  mosaic-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
    ports:
      # Published on the host so `dotnet run` and `docker compose up` reach the
      # same database with the same connection string. A deployed Mosaic would
      # not publish this port at all.
      - "5432:5432"
    volumes:
      # Mounted at /var/lib/postgresql, not at its /data subdirectory. The
      # official image changed this at 18: it now keeps the cluster in a
      # version-named directory underneath, so that pg_upgrade can see the old
      # and the new one without crossing a mount point. Mount the old path
      # against an 18 image and the container refuses to start, with a long and
      # unusually good explanation of why.
      - mosaic-db-data:/var/lib/postgresql
    healthcheck:
      # pg_isready answers as soon as the server accepts connections. The first
      # start of a fresh volume runs initdb and then restarts the server, so
      # without a health gate the API would connect during that window and die.
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - mosaic
    restart: unless-stopped

  mosaic-catalog:
    # Chapter 8's extraction, and the shape the other five copied. Deliberately
    # identical from here down to the healthcheck: six services that start,
    # answer and fail the same way are a platform, and the copies are what let
    # one team change theirs without asking the other five.
    build:
      context: .
      dockerfile: src/Mosaic.Catalog/Dockerfile
    image: mosaic-catalog:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      # Development because HotChocolate 16 serves introspection in no other
      # environment, and a subgraph nothing can introspect is a subgraph no tool
      # can be pointed at. A development baseline, not a production posture, and
      # all six say so.
      ASPNETCORE_ENVIRONMENT: Development

      # Catalog's own database, on the server the six services share. A database
      # of its own rather than another schema inside one: the six services own
      # their data separately, and a join across any of those seams should not
      # be one connection string away. The credentials are still the shared
      # development ones, which is a convenience here and would be a finding
      # anywhere else.
      #
      # Nothing in this file creates the database. EF Core's EnsureCreatedAsync
      # does, on first start, which is why chapters 8 and 12 between them added
      # six services here and no storage.
      ConnectionStrings__Catalog: "Host=mosaic-db;Port=5432;Database=catalog;Username=mosaic;Password=mosaic"
    ports:
      # Host 5101 to container 8080, matching the launch profile and the
      # routing URL federation/mosaic.yaml gives this subgraph, so composing
      # against a running Catalog does not depend on how it was started.
      - "5101:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # HotChocolate 16 builds the whole schema during startup, so a schema
      # error kills the container at boot instead of waiting for the first
      # query, and the seeder creates the database before it fills it. All of
      # that happens before /health answers, and start_period covers it:
      # failures inside the window do not count against the container.
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Chapter 12's five. Everything below repeats the block above with a name, a
  # port and a database changed.
  # -------------------------------------------------------------------------

  mosaic-pricing:
    build:
      context: .
      dockerfile: src/Mosaic.Pricing/Dockerfile
    image: mosaic-pricing:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Pricing: "Host=mosaic-db;Port=5432;Database=pricing;Username=mosaic;Password=mosaic"
    ports:
      - "5102:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mosaic-inventory:
    build:
      context: .
      dockerfile: src/Mosaic.Inventory/Dockerfile
    image: mosaic-inventory:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Inventory: "Host=mosaic-db;Port=5432;Database=inventory;Username=mosaic;Password=mosaic"
    ports:
      - "5103:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mosaic-accounts:
    build:
      context: .
      dockerfile: src/Mosaic.Accounts/Dockerfile
    image: mosaic-accounts:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Accounts: "Host=mosaic-db;Port=5432;Database=accounts;Username=mosaic;Password=mosaic"
    ports:
      - "5104:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mosaic-reviews:
    build:
      context: .
      dockerfile: src/Mosaic.Reviews/Dockerfile
    image: mosaic-reviews:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Reviews: "Host=mosaic-db;Port=5432;Database=reviews;Username=mosaic;Password=mosaic"
    ports:
      - "5105:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mosaic-ordering:
    build:
      context: .
      dockerfile: src/Mosaic.Ordering/Dockerfile
    image: mosaic-ordering:dev
    depends_on:
      mosaic-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Ordering: "Host=mosaic-db;Port=5432;Database=ordering;Username=mosaic;Password=mosaic"
    ports:
      - "5106:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # The seventh subgraph, added in chapter 13, and the only entry in this file
  # with neither a depends_on nor a connection string. It owns Query.node and
  # Query.nodes on behalf of the whole graph, and answering them is decoding an
  # identifier and handing the key back in a wrapper, which needs no storage.
  mosaic-nodes:
    build:
      context: .
      dockerfile: src/Mosaic.Nodes/Dockerfile
    image: mosaic-nodes:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5107:8080"
    networks:
      - mosaic
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mosaic-router:
    # Chapter 10. The Cosmo Router, in front of the six subgraphs above,
    # serving the whole graph on 3002. It is the only part of Mosaic that is
    # configured rather than written, and everything it knows about the graph
    # is in the two files mounted below. Note what did not change in chapter 12:
    # this block. The router went from two subgraphs to six by being handed a
    # different execution config.
    #
    # No depends_on. The router reads its execution config from disk and
    # contacts no subgraph at startup, so there is nothing here for it to wait
    # for; it will start against subgraphs that do not exist yet and answer the
    # first query once they do.
    image: ghcr.io/wundergraph/cosmo/router:0.337.1
    environment:
      # No GRAPH_API_TOKEN, for the same reason wire-router has none: the token
      # is how the router fetches a schema from the Cosmo registry, and this
      # one is handed its schema. The cost is the Cosmo Cloud features it names
      # in a startup warning, all of which chapter 21 is where we go looking
      # for a control plane.
      CONFIG_PATH: "/etc/mosaic-router/config.yaml"
    volumes:
      # The composed graph, from chapter 9, and the router's own configuration.
      # Two mounts because the two files change for different reasons and at
      # different times: one is regenerated by a build step, the other is
      # edited by a person.
      #
      # config.yaml turns on watching for the first of them, and wgc writes the
      # composed config in place rather than replacing it, so recomposing on
      # the host while this container runs swaps the graph over without a
      # restart.
      - ./federation/supergraph.json:/etc/mosaic/supergraph.json:ro
      - ./router/config.yaml:/etc/mosaic-router/config.yaml:ro
    ports:
      # 3002 is the router's own default and the port every Cosmo document
      # uses. wire-router publishes the same one, which is safe only because
      # that service is behind the "wire" profile and the two are never meant
      # to be up together. Start both and the second one fails to bind.
      - "3002:3002"
    extra_hosts:
      # federation/supergraph.json routes to http://localhost:5101/graphql
      # through http://localhost:5106/graphql, which are the URLs the six
      # subgraphs answer on the host. Inside a container localhost is the
      # container, so the router rewrites those to host.docker.internal on its
      # own: the setting is localhost_fallback_inside_docker and it defaults to
      # true. This line is what makes that name resolve.
      #
      # It means the router leaves the machine and comes back in through the
      # published port even when all seven services are containers here. That
      # is a development convenience: it keeps one composed config working
      # whether the subgraphs were started with `dotnet run` or by this file.
      # A deployment would point the router at the services directly with
      # overrides.subgraphs.routing_url rather than route through the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  wire-router:
    # Chapter 7's sample: the Cosmo Router in front of the two subgraphs under
    # samples/federated-wire. It is behind a compose profile, so nothing that
    # starts Mosaic starts this, and it is not on the mosaic network because it
    # talks to two processes on the host rather than to anything in this file.
    #
    # Compose the execution config before bringing this up, or the bind mount
    # below creates a directory where the file should be:
    #
    #   npx wgc router compose -i samples/federated-wire/graph.yaml \
    #                          -o samples/federated-wire/supergraph.json
    profiles: ["wire"]
    image: ghcr.io/wundergraph/cosmo/router:0.337.1
    environment:
      # No GRAPH_API_TOKEN. The router wants one to fetch its schema from the
      # Cosmo registry; with a static execution config there is nothing to
      # fetch, and the documented cost of leaving it out is that the default
      # telemetry stack stays off.
      EXECUTION_CONFIG_FILE_PATH: "/etc/wire/supergraph.json"

      # Development mode does two things chapter 7 needs: readable log output,
      # and Advanced Request Tracing without an authentication check in front
      # of it. Query plans are part of that, so this is not optional here.
      DEV_MODE: "true"
      LISTEN_ADDR: "0.0.0.0:3002"
    volumes:
      - ./samples/federated-wire/supergraph.json:/etc/wire/supergraph.json:ro
    ports:
      - "3002:3002"
    extra_hosts:
      # The subgraphs run on the host under `dotnet run`, not in a container.
      - "host.docker.internal:host-gateway"

  entities-router:
    # Chapter 11's sample: the Cosmo Router in front of the two subgraphs under
    # samples/entity-resolution. Behind a profile of its own, and on 3003
    # rather than 3002, because unlike chapter 7's sample this one is worth
    # running beside Mosaic: the chapter compares a plan here with a plan
    # there.
    #
    # Compose the execution config before bringing this up, or the bind mount
    # below creates a directory where the file should be:
    #
    #   npx wgc router compose -i samples/entity-resolution/graph.yaml \
    #                          -o samples/entity-resolution/supergraph.json
    profiles: ["entities"]
    image: ghcr.io/wundergraph/cosmo/router:0.337.1
    environment:
      EXECUTION_CONFIG_FILE_PATH: "/etc/entities/supergraph.json"

      # Development mode, for the query plan headers and for Advanced Request
      # Tracing. Chapter 11 reads the representations the router sent out of a
      # trace, so this is not optional here either.
      DEV_MODE: "true"
      LISTEN_ADDR: "0.0.0.0:3003"
    volumes:
      - ./samples/entity-resolution/supergraph.json:/etc/entities/supergraph.json:ro
    ports:
      - "3003:3003"
    extra_hosts:
      # Both subgraphs run on the host under `dotnet run`, not in a container.
      - "host.docker.internal:host-gateway"

  interfaces-router:
    # Chapter 13's sample: the Cosmo Router in front of the two subgraphs under
    # samples/interface-object. Third sample router, third profile, third port,
    # for the same reason as the other two: nothing that starts Mosaic starts
    # this, and the three are never meant to be up together.
    #
    # Compose the execution config before bringing this up, or the bind mount
    # below creates a directory where the file should be:
    #
    #   npx wgc router compose -i samples/interface-object/graph.yaml \
    #                          -o samples/interface-object/supergraph.json
    profiles: ["interfaces"]
    image: ghcr.io/wundergraph/cosmo/router:0.337.1
    environment:
      EXECUTION_CONFIG_FILE_PATH: "/etc/interfaces/supergraph.json"

      # Development mode, for the query plan headers. The plan is where the
      # representations the router builds for an @interfaceObject fetch are
      # visible, so this is not optional here either.
      DEV_MODE: "true"
      LISTEN_ADDR: "0.0.0.0:3004"
    volumes:
      - ./samples/interface-object/supergraph.json:/etc/interfaces/supergraph.json:ro
    ports:
      - "3004:3004"
    extra_hosts:
      # Both subgraphs run on the host under `dotnet run`, not in a container.
      - "host.docker.internal:host-gateway"

networks:
  mosaic:
    name: mosaic

volumes:
  mosaic-db-data:
    name: mosaic-db-data
