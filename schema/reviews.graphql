schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.6"
    import: ["@authenticated", "@key", "@shareable", "@tag", "FieldSet"]
  ) {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  _service: _Service!
  _entities(representations: [_Any!]!): [_Entity]!
}

type Mutation {
  submitReview(input: SubmitReviewInput!): SubmitReviewPayload!
    @authenticated
    @authorize(policy: "ReviewsWrite")
}

type Subscription {
  onReviewAdded(productId: ID!): Review!
}

type Customer @key(fields: "id", resolvable: false) {
  id: ID!
}

type DuplicateReviewError implements Error {
  message: String!
  code: String!
}

"A cursor that points to a specific page."
type PageCursor @shareable {
  "The page number."
  page: Int!
  "The cursor."
  cursor: String!
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean! @shareable
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean! @shareable
  "When paginating backwards, the cursor to continue."
  startCursor: String @shareable
  "When paginating forwards, the cursor to continue."
  endCursor: String @shareable
  "A list of cursors to continue paginating forwards."
  forwardCursors: [PageCursor!]! @shareable
  "A list of cursors to continue paginating backwards."
  backwardCursors: [PageCursor!]! @shareable
}

type Product @key(fields: "id") {
  reviews(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): ReviewConnection!
  averageRating: Float
  id: ID!
}

type RatingOutOfRangeError implements Error {
  message: String!
  code: String!
  min: Int!
  max: Int!
}

type Review implements Node @key(fields: "id") {
  id: ID!
  author: Customer
  rating: Int!
  body: String
  createdAt: DateTime!
}

"A connection to a list of items."
type ReviewConnection {
  "A list of edges."
  edges: [ReviewEdge!]
  "A flattened list of the nodes"
  nodes: [Review!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "Identifies the total count of items in the connection."
  totalCount: Int!
}

type ReviewEdge {
  "The item at the end of the edge."
  node: Review!
  "A cursor for use in pagination."
  cursor: String!
}

type SubmitReviewPayload {
  review: Review
  errors: [SubmitReviewError!]
}

"This type provides a field named sdl: String! which exposes the SDL of the service's schema. This SDL (schema definition language) is a printed version of the service's schema including the annotations of federation directives. This SDL does not include the additions of the federation spec."
type _Service {
  sdl: String!
}

interface Error {
  message: String!
  code: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

union SubmitReviewError = RatingOutOfRangeError | DuplicateReviewError

"Union of all types that key directive applied. This information is needed by the Apollo federation gateway."
union _Entity = Product | Review

input SubmitReviewInput {
  productId: ID!
  customerId: ID!
  rating: Int!
  body: String
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"Scalar representing a set of fields."
scalar FieldSet

"The _Any scalar is used to pass representations of entities from external services into the root _entities field for execution. Validation of the _Any scalar is done by matching the __typename and @external fields defined in the schema."
scalar _Any

"Indicates to composition that the target element is accessible only to the authenticated supergraph users."
directive @authenticated on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | INTERFACE
  | ENUM

"The authorize directive."
directive @authorize(
  "The name of the authorization policy that determines access to the annotated resource."
  policy: String
  "Roles that are allowed to access the annotated resource."
  roles: [String!]
  "Defines when the authorize directive shall be applied. By default the authorize directive is applied before the resolver is executed."
  apply: ApplyPolicy! = BEFORE_RESOLVER
) repeatable on OBJECT | FIELD_DEFINITION

"Used to indicate a combination of fields that can be used to uniquely identify and fetch an object or interface."
directive @key(fields: FieldSet!, resolvable: Boolean = true) repeatable on
  | OBJECT
  | INTERFACE

"Links definitions within the document to external schemas."
directive @link(
  "Gets imported specification url."
  url: String!
  "Gets optional list of imported element names."
  import: [String!]
) repeatable on SCHEMA

"Indicates that given object and/or field can be resolved by multiple subgraphs."
directive @shareable repeatable on OBJECT | FIELD_DEFINITION
