# Mosaic's router. Chapter 10.
#
# Chapter 9 composed federation/supergraph.json and nothing loaded it. This
# file is what loads it. The router needs no account, no registry and no
# network: an execution config on disk is a complete description of the graph,
# and everything below is about this process rather than about the graph.
#
# The schema for this file is published, and pointing an editor at it is worth
# the one line, because the router accepts 66 top-level keys at 0.337.1 and
# silently ignores nothing - a key it does not know is a startup failure.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/wundergraph/cosmo/main/router/pkg/config/config.schema.json

version: "1"

# Where the graph comes from.
#
# `router_config_path` is the older spelling of this and is deprecated in
# favour of execution_config; the environment variable chapter 7 used,
# EXECUTION_CONFIG_FILE_PATH, is this key's env form and is not deprecated.
#
# watch means the router re-reads the file when it changes and swaps the graph
# in without dropping a request. wgc writes the composed config in place rather
# than replacing it, so this works even though the file is bind-mounted on its
# own: recompose while the router is up and the new graph is live about a
# second later.
execution_config:
  file:
    path: /etc/mosaic/supergraph.json
    watch: true
    watch_interval: 1s

# 0.0.0.0, not the default. The default is localhost:3002, which inside a
# container means the container's own loopback interface and nothing outside it
# can connect - the router starts, logs that it is serving, and refuses every
# connection.
listen_addr: "0.0.0.0:3002"

# Development mode. It buys readable logs and, more importantly here, Advanced
# Request Tracing without a signed request, which is what makes the query plan
# headers work. Chapter 7 needed the same thing for the same reason.
#
# This is a development baseline and not a production posture, exactly like the
# ASPNETCORE_ENVIRONMENT: Development on both subgraphs in docker-compose.yml.
# A deployed router leaves this off and signs its tracing requests instead.
dev_mode: true

# Named rather than left to the default, because this file is also the answer
# to "which of these settings is the router actually using". A value here beats
# the environment variable that sets the same thing, which is the opposite of
# what most container tooling does; see chapter 10.
log_level: info

# Chapter 14. Where the router gets its events from, for the one subgraph in
# federation/mosaic.yaml that has no service behind it.
#
# This block and schema/streams.graphql are two halves of one feature and they
# are deliberately in different files. The schema says which subject a field
# listens on; this says where the broker is and how to authenticate to it. A
# subject name is part of a contract between teams and belongs in a schema a
# composer reads; a broker url is a property of a deployment and belongs
# wherever the rest of the deployment's addresses live.
#
# `default` is the provider id every @edfs__natsSubscribe in this graph names,
# because its providerId argument defaults to "default" and nothing overrides
# it. A second broker would be a second entry here and a providerId on the
# directive.
events:
  providers:
    nats:
      - id: default
        url: "nats://host.docker.internal:4222"

# Chapter 15. Who the caller is.
#
# The router validates the token before it plans anything, and what it learns
# is what the @authenticated and @requiresScopes directives in the composed
# config are checked against. Nothing below mentions a field: the graph carries
# its own rules and this block only says how to read a token.
#
# A symmetric secret rather than a JWKS endpoint, because Mosaic has no identity
# provider and standing one up would be a chapter about OAuth. The url form is
# the one a deployment uses and is a two-line swap:
#
#   jwks:
#     - url: https://your-idp/.well-known/jwks.json
#       algorithms: ["RS256"]
#       refresh_interval: 1m
#
# Note what this block does NOT log. Started with it, the router says exactly
# what it says without it - there is no line at any level, debug included,
# confirming that JWT validation is on. The way to find out is to send a bad
# token and get a 401, or to send a good one and read the X-Authenticated-By
# response header. A misspelled key here, by contrast, is a hard startup
# failure with a JSON Schema error naming the exact path, which is the opposite
# of how wgc treated a misspelled key in chapter 14.
# header_key_id is not optional on the symmetric branch, and the router will
# not start without it: the config schema is a oneOf, the url branch wants
# `url`, and the secret branch wants `secret`, `symmetric_algorithm` and
# `header_key_id` together. So every token Mosaic mints carries a `kid` header
# with this value, and scripts/mint-token.mjs is where that happens.
authentication:
  jwt:
    jwks:
      - symmetric_algorithm: HS256
        secret: "${MOSAIC_JWT_SECRET}"
        header_key_id: mosaic-dev

# Left at the defaults, written out, because both are decisions.
#
# require_authentication: false keeps the storefront public. Mosaic sells to
# people who have not signed in, so a graph that refused anonymous requests
# outright would be the wrong graph. Fields that need a caller say so
# themselves, and the router refuses those to an anonymous request whatever
# this setting is: an @authenticated field is denied because the caller has no
# identity, not because the router requires one globally.
#
# reject_operation_if_unauthorized: false means an operation that asks for one
# field it may not have gets the rest of its data and an error for that field,
# rather than nothing. That is the friendlier answer and it is not obviously the
# right one; chapter 25 revisits it with the rest of the hardening.
#
# enable_pre_fetch_field_authorization is the one that is NOT left at its
# default, and it was turned on because of a measurement rather than on
# principle. Off, which is how it ships, the router plans the operation, calls
# the subgraph, gets the answer, and only then discards the field the caller was
# never allowed: an anonymous request for Customer.email costs Accounts one
# request that is thrown away, counted on the request timeline. On, the field is
# refused before any fetch runs and the subgraph is not called at all.
#
# The saving is not really the round trip. It is that data a caller may not see
# stops being loaded into a process on their behalf, which is a smaller blast
# radius when something later goes wrong with how a response is assembled.
authorization:
  require_authentication: false
  reject_operation_if_unauthorized: false
  enable_pre_fetch_field_authorization: true

# Chapter 7 measured that the router forwards no client header to a subgraph,
# and chapter 15 is the first chapter that needs one to arrive.
#
# The rule is deliberately the blunt one: propagate the Authorization header
# itself, so every subgraph gets the caller's token and validates it again.
# WunderGraph's documentation recommends the other arrangement - do not forward
# the token, and instead `set` a header derived from a claim:
#
#   - op: "set"
#     name: "X-Mosaic-Customer"
#     expression: "request.auth.isAuthenticated ? request.auth.claims.sub : ''"
#
# which is smaller on the wire, keeps the token in one process, and is what
# Mosaic would do if its subgraphs were unreachable except through the router.
# They are not: all seven listen on a host port, and a header a subgraph trusts
# is a header anybody can send it. The cost of the choice made here is a
# signature verification per subgraph per request; the cost of the other one is
# that the whole model depends on a network boundary nothing in this repository
# enforces.
#
# One rule covers both transports. The same propagate entry moves the header on
# an ordinary HTTP subgraph fetch and on the WebSocket upgrade the router makes
# for a subscription; there is no second, WebSocket-specific block for it.
headers:
  all:
    request:
      - op: propagate
        named: Authorization

# Chapter 15, and the block Mosaic does not have.
#
# A browser cannot set a header on a WebSocket upgrade. The WebSocket
# constructor takes a url and a subprotocol list and that is all, and node's
# built-in WebSocket is the same, so the Authorization header the rule above
# propagates so neatly is a header a subscribing client cannot send. Cosmo's
# answer is to read the token out of the first message instead:
#
#   websocket:
#     authentication:
#       from_initial_payload:
#         enabled: true
#         key: "Authorization"          # the property to read; Bearer prefix required
#         export_token:
#           enabled: true
#           header_key: "Authorization" # written verbatim onto subgraph requests
#
# It is commented out because turning it on takes the storefront off the
# internet. Measured, and isolated by adding and removing this block and
# nothing else: with it, an anonymous `{ __typename }` over ordinary HTTP is
# answered `401 unauthorized`, on a router whose require_authentication is
# false. Nothing in the block mentions HTTP and it closes HTTP. It is the
# fifth case in scripts/router-cases.mjs, so a release that fixes it fails the
# gate and gets read rather than passing quietly. It also refuses a subscription
# that offers no token at all, at connection_init, with `invalid JWT token in
# initial payload: JWT token is not a string` - so with this block on there is
# no such thing as an anonymous subscription either.
#
# The second half of it, measured while the block was on: even then the router
# does not apply that identity to its own field authorization. A subscription
# selecting an @authenticated field is refused as "not authenticated" on every
# event, while the same connection resolves public fields across a subgraph
# boundary and the token itself arrives at Accounts correctly formed with its
# Bearer prefix. So there is no configuration of 0.337.1 that gives Mosaic both
# a public storefront and a subscription that can select a guarded field, and
# the honest thing is to run without the block and say so in the chapter.
#
# Re-measured 2026-08-12 on a second router running this whole file plus the
# block, counting requests at Accounts, because the shipped configuration and
# that one turned out to answer a mixed selection differently and the reason
# was worth having. With the block, `author { displayName email }` costs
# Accounts one request and the ROUTER refuses the email: the fetch went out
# carrying displayName alone, so the router pruned the guarded field out of a
# fetch it still made. Without the block the same selection costs one request
# and ACCOUNTS refuses, because the guarded field travelled inside it. Both
# configurations differ in this block and in whether the connection has any
# identity at all, and the two cannot be separated: with the block on, a
# connection_init carrying no token is rejected outright.

# Chapter 17, and the second block Mosaic does not ship.
#
# The router keeps seven caches in front of execution - the plan cache, three
# around normalization, one for persisted operations, one for validation and one
# for the operation hash. router/core/graph_server.go:930-954 at router@0.337.1
# registers metrics for all seven by name, and the router publishes nothing
# about any of them by default, because
# telemetry.metrics.prometheus.graphql_cache is false unless you say otherwise.
# That is why chapter 10 saw the Prometheus endpoint in the startup log and no
# chapter before this one could see a single cache hit.
#
#   telemetry:
#     metrics:
#       prometheus:
#         enabled: true
#         listen_addr: "0.0.0.0:8088"
#         graphql_cache: true
#
# Commented out rather than shipped, for the same reason as the block above:
# nothing in this repository would read it. scripts/planner-cases.mjs takes a
# different and sharper route to the same facts, asking for
# request.operation.queryPlanHash and request.operation.planCacheHit as
# access-log fields, which reports the actual cache key for each request rather
# than a sampled counter for all of them. A setting no gate exercises is a
# setting that rots.
#
# Turn it on if you are operating this graph rather than reading about it; it
# also wants the port published, which docker-compose.yml does not do.
# Chapter 23 owns observability and is where this stops being a comment.
